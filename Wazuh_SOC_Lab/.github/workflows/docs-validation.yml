name: Repository validation
on:
  push:
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate documentation and example XML
        run: python -m unittest discover -s tests -v
      - name: Validate Bash scripts
        run: bash -n scripts/ubuntu/*.sh scripts/kali/*.sh
# Static checks only; not proof that Wazuh services or custom rules function live.
