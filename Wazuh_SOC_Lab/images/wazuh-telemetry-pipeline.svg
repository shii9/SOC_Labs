<rect x="79" y="468" width="570" height="194" rx="16" fill="#122A43" stroke="#2D826F" stroke-width="2"/>
<rect x="109" y="488" width="139" height="30" rx="15" fill="#073B42" stroke="none" stroke-width="1"/>
<text x="178.5" y="509" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#A7F3D0" text-anchor="middle">ALERT PATH</text>
<text x="110" y="550" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="750" fill="#FFFFFF" text-anchor="start">alerts.json</text>
<text x="110" y="586" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#BDD5E3" text-anchor="start">Only events generating Wazuh alerts</text>
<text x="110" y="621" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#7DDDBE" text-anchor="start">Dashboard: Threat Hunting / wazuh-alerts-*</text>
<rect x="706" y="468" width="610" height="194" rx="16" fill="#122A43" stroke="#47689A" stroke-width="2"/>
<rect x="737" y="488" width="207" height="30" rx="15" fill="#26395E" stroke="none" stroke-width="1"/>
<text x="840.5" y="509" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#A7F3D0" text-anchor="middle">OPTIONAL RAW PATH</text>
<text x="737" y="550" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="750" fill="#FFFFFF" text-anchor="start">archives.json</text>
<text x="737" y="586" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#BDD5E3" text-anchor="start">All collected raw events when logall_json=yes</text>
<text x="737" y="621" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#A0C8FF" text-anchor="start">Discover / wazuh-archives-* when Filebeat enabled</text>
<rect x="93" y="700" width="1397" height="57" rx="12" fill="#0D2944" stroke="#284A69" stroke-width="1"/>
<text x="122" y="736" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="580" fill="#E0F2FE" text-anchor="start">Wazuh detection rules execute on the Manager, not on the Indexer. Raw logs may not trigger alerts.</text>
</svg>