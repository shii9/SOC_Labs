<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-label="Wazuh data pipeline separates alerts and raw archives">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2DD4BF"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#93B4CA"/></marker><filter id="shade"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06152E" flood-opacity="0.22"/></filter></defs>
<rect width="1600" height="800" fill="#08162D"/>
<text x="68" y="71" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="750" fill="#FFFFFF" text-anchor="start">TELEMETRY  →  DETECTION  →  SEARCH</text>
<text x="69" y="111" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#9BB7D0" text-anchor="start">Wazuh Manager is the detection engine; Filebeat forwards JSON; Indexer stores and searches.</text>
<rect x="54" y="201" width="300" height="150" rx="16" fill="#173452" stroke="#2DD4BF" stroke-width="2"/>
<text x="77" y="251" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="750" fill="#FFFFFF" text-anchor="start">ENDPOINT AGENTS</text>
<text x="77" y="285" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#C0D8E9" text-anchor="start">Windows + Linux</text>
<text x="77" y="319" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#82B7C7" text-anchor="start">192.168.x.x</text>
<rect x="422" y="201" width="315" height="150" rx="16" fill="#173452" stroke="#2DD4BF" stroke-width="2"/>
<text x="445" y="251" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="750" fill="#FFFFFF" text-anchor="start">WAZUH MANAGER</text>
<text x="445" y="285" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#C0D8E9" text-anchor="start">Decoders + rule engine</text>
<text x="445" y="319" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#82B7C7" text-anchor="start">Ubuntu Server VM</text>
<rect x="808" y="201" width="308" height="150" rx="16" fill="#173452" stroke="#65ABCF" stroke-width="2"/>
<text x="831" y="251" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="750" fill="#FFFFFF" text-anchor="start">FILEBEAT</text>
<text x="831" y="285" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#C0D8E9" text-anchor="start">JSON forwarding</text>
<text x="831" y="319" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#82B7C7" text-anchor="start">Ubuntu Server VM</text>
<rect x="1180" y="201" width="360" height="150" rx="16" fill="#173452" stroke="#65ABCF" stroke-width="2"/>
<text x="1203" y="251" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="750" fill="#FFFFFF" text-anchor="start">WAZUH INDEXER</text>
<text x="1203" y="285" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#C0D8E9" text-anchor="start">Index and search</text>
<text x="1203" y="319" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#82B7C7" text-anchor="start">Ubuntu Server VM</text>
